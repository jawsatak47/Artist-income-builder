<script type="text/babel">
        // This will find the app whether you named it ArtistIncomeEngine or App
        const root = ReactDOM.createRoot(document.getElementById('root'));
        if (typeof ArtistIncomeEngine !== 'undefined') {
            root.render(<ArtistIncomeEngine />);
        } else if (typeof App !== 'undefined') {
            root.render(<App />);
        } else {
            console.error("Could not find a component named ArtistIncomeEngine or App.");
        }
    </script>
