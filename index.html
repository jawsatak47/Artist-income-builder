<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artist Income Engine</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        body { background-color: #080808; margin: 0; padding: 0; }
        #root { min-height: 100vh; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // ── PALETTE ─────────────────────────────────────────────────────────────────
        const C = {
            bg:    '#080808',
            s1:    '#0F0F0F',
            s2:    '#171717',
            s3:    '#202020',
            bd:    '#2C2C2C',
            tx:    '#F0F0F0',
            mu:    '#545454',
            mu2:   '#888888',
            ac:    '#BAFF29',   // acid green = money
            acDim: 'rgba(186,255,41,0.1)',
            da:    '#FF3E3E',
            or:    '#FF8C00',
            bl:    '#3D8EFF',
            pu:    '#BB77FF',
        };
        const FH = "'Barlow Condensed', 'Arial Narrow', sans-serif";
        const FM = "'JetBrains Mono', 'Courier New', monospace";

        // ── CONSTANTS ────────────────────────────────────────────────────────────────
        const CAT_META = {
            originals:   { label: 'Originals',    icon: '🎨' },
            prints:      { label: 'Prints',       icon: '🖼️' },
            commissions: { label: 'Commissions',  icon: '✏️' },
            digital:     { label: 'Digital',      icon: '💻' },
            other:       { label: 'Other',        icon: '📦' },
        };

        const STAGES = [
            { id: 'found',        label: '🔍 Found',        color: C.mu2 },
            { id: 'contacted',    label: '📩 Contacted',    color: C.bl  },
            { id: 'conversation', label: '💬 In Convo',     color: C.or  },
            { id: 'negotiating',  label: '🤝 Negotiating',  color: C.pu  },
            { id: 'confirmed',    label: '💰 Confirmed',    color: C.ac  },
            { id: 'rejected',     label: '❌ Dead',          color: C.da  },
        ];

        const OPP_TYPES = ['Shop','Wall','Gallery','Event','Other'];

        const TABS = [
            { id: 'dashboard', label: 'Board',    icon: '⚡' },
            { id: 'income',    label: 'Income',   icon: '💵' },
            { id: 'roi',       label: 'ROI',      icon: '📊' },
            { id: 'pipeline',  label: 'Pipeline', icon: '🎯' },
        ];

        // ── UTILS ────────────────────────────────────────────────────────────────────
        const uid = () => Math.random().toString(36).slice(2, 9);
        const today = () => new Date().toISOString().slice(0, 10);
        const thisMonth = () => new Date().toISOString().slice(0, 7);
        const monthLabel = () => new Date().toLocaleString('default', { month: 'long', year: 'numeric' });

        const fmt = n => {
            const v = Number(n || 0);
            return '$' + v.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        };
        const fmtShort = n => {
            const v = Number(n || 0);
            if (v >= 1000) return '$' + (v / 1000).toFixed(1) + 'k';
            return '$' + Math.round(v);
        };

        const sumBy = (arr, key) => arr.reduce((s, e) => s + Number(e[key] || 0), 0);
        const getMonthIncome = income => income.filter(e => (e.date || '').startsWith(thisMonth()));
        const catTotals = income => Object.keys(CAT_META).map(id => ({
            id, label: CAT_META[id].icon + ' ' + CAT_META[id].label,
            total: sumBy(income.filter(e => e.cat === id), 'amount'),
        })).sort((a, b) => b.total - a.total);

        // ── UI COMPONENTS ───────────────────────────────────────────────────────────
        const Btn = ({ children, onClick, variant = 'primary', size = 'md', disabled, sx = {} }) => {
            const [hover, setHover] = useState(false);
            const sizes = { sm: { padding: '5px 12px', fontSize: 11 }, md: { padding: '9px 18px', fontSize: 13 } };
            const variants = {
                primary:   { background: hover ? '#CCFF44' : C.ac, color: '#000' },
                secondary: { background: hover ? C.s3 : C.s2, color: C.tx, border: `1px solid ${C.bd}` },
                ghost:     { background: 'transparent', color: hover ? C.tx : C.mu, border: `1px solid ${hover ? C.bd : '#1A1A1A'}` },
            };
            return (
                <button onClick={onClick} disabled={disabled} onMouseEnter={() => setHover(true)} onMouseLeave={() => setHover(false)}
                    style={{ fontFamily: FH, fontWeight: 700, textTransform: 'uppercase', cursor: disabled ? 'not-allowed' : 'pointer', border: 'none', transition: 'all 0.1s', ...sizes[size], ...variants[variant], ...sx }}
                >{children}</button>
            );
        };

        const Card = ({ children, sx = {} }) => (
            <div style={{ background: C.s1, border: `1px solid ${C.bd}`, padding: 16, borderRadius: 4, ...sx }}>{children}</div>
        );

        const SectionLabel = ({ children }) => (
            <div style={{ fontFamily: FH, fontSize: 10, fontWeight: 700, color: C.mu, letterSpacing: '0.12em', textTransform: 'uppercase', marginBottom: 10 }}>{children}</div>
        );

        // ── MAIN APP ENGINE ────────────────────────────────────────────────────────
        const ArtistIncomeEngine = () => {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [income, setIncome] = useState([]);
            const [artworks, setArtworks] = useState([]);
            const [opps, setOpps] = useState([]);
            const [monthGoal, setMonthGoal] = useState(1000);

            return (
                <div style={{ maxWidth: 600, margin: '0 auto', padding: '20px 15px', color: C.tx }}>
                    <header style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 20 }}>
                        <div style={{ fontFamily: FH, fontSize: 24, fontWeight: 900, color: C.ac }}>ARTIST INCOME ENGINE</div>
                        <div style={{ display: 'flex', gap: 10 }}>
                            {TABS.map(t => (
                                <button key={t.id} onClick={() => setActiveTab(t.id)} 
                                    style={{ background: 'none', border: 'none', color: activeTab === t.id ? C.ac : C.mu, cursor: 'pointer', fontFamily: FH, fontSize: 14, fontWeight: 700 }}>
                                    {t.icon} {t.label}
                                </button>
                            ))}
                        </div>
                    </header>

                    {activeTab === 'dashboard' && (
                        <div style={{ display: 'flex', flexDirection: 'column', gap: 15 }}>
                            <Card>
                                <SectionLabel>{monthLabel()} Progress</SectionLabel>
                                <div style={{ fontSize: 40, fontFamily: FH, fontWeight: 900, color: C.ac }}>{fmt(sumBy(getMonthIncome(income), 'amount'))}</div>
                                <div style={{ fontSize: 12, color: C.mu, fontFamily: FM }}>Goal: {fmt(monthGoal)}</div>
                                <div style={{ background: C.s3, height: 8, marginTop: 10, borderRadius: 4 }}>
                                    <div style={{ width: `${Math.min((sumBy(getMonthIncome(income), 'amount') / monthGoal) * 100, 100)}%`, background: C.ac, height: '100%', borderRadius: 4 }} />
                                </div>
                            </Card>
                            <Card>
                                <SectionLabel>Quick Tip</SectionLabel>
                                <p style={{ fontFamily: FM, fontSize: 13, color: C.mu2 }}>Consistent leads = Consistent cash. Update your pipeline daily.</p>
                            </Card>
                        </div>
                    )}

                    {activeTab !== 'dashboard' && (
                        <Card>
                            <SectionLabel>{activeTab} Module</SectionLabel>
                            <p style={{ fontFamily: FM, fontSize: 13, color: C.mu2 }}>Module data loading... Add entries in the code to expand.</p>
                            <Btn onClick={() => setActiveTab('dashboard')} variant="secondary">Back to Board</Btn>
                        </Card>
                    )}
                </div>
            );
        };

        // ── RENDER ──────────────────────────────────────────────────────────────────
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ArtistIncomeEngine />);
    </script>
</body>
</html>
